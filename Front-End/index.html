<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security & Best Practices -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Primary Meta Tags -->
    <title>Beautify Africa | Beauty & Skincare</title>
    <meta name="title" content="Beautify Africa | Premium Global Beauty & Cosmetics" />
    <meta
      name="description"
      content="Discover top global beauty, vibrant makeup, and luxury skincare essentials. Curated for every skin tone, type, and texture with 100% cruelty-free formulas."
    />
    <meta
      name="keywords"
      content="global beauty, cosmetics, makeup, skincare, inclusive shades, cruelty-free beauty, luxury cosmetics"
    />
    <meta name="author" content="Beautify Africa" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://beautify-africa.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://beautify-africa.com/" />
    <meta property="og:title" content="Beautify Africa | Premium Global Beauty & Cosmetics" />
    <meta
      property="og:description"
      content="Discover top global beauty, vibrant makeup, and luxury skincare essentials. Curated for every skin tone, type, and texture with 100% cruelty-free formulas."
    />
    <meta property="og:image" content="https://beautify-africa.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Beautify Africa - Premium Global Beauty & Cosmetics Products" />
    <meta property="og:site_name" content="Beautify Africa" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://beautify-africa.com/" />
    <meta name="twitter:title" content="Beautify Africa | Premium Global Beauty & Cosmetics" />
    <meta
      name="twitter:description"
      content="Discover top global beauty, vibrant makeup, and luxury skincare essentials. Curated for every skin tone, type, and texture with 100% cruelty-free formulas."
    />
    <meta name="twitter:image" content="https://beautify-africa.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Beautify Africa - Premium Global Beauty & Cosmetics Products" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#faf9f6" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Favicon & PWA Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts - Use display=swap for non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Performance optimizations -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
  </head>
  <body class="bg-[#faf9f6]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
