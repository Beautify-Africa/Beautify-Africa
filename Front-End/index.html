<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security & Best Practices -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' http://localhost:5000; script-src 'self' 'unsafe-inline' https://js.stripe.com https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com https://images.unsplash.com https://*.stripe.com; connect-src 'self' http://localhost:5000 ws://localhost:5173 ws://127.0.0.1:5173 https://api.stripe.com https://api.paystack.co https://*.vercel-insights.com https://*.vercel-analytics.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://checkout.paystack.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests; block-all-mixed-content;"
    />

    <!-- Primary Meta Tags -->
    <title>Beautify Africa | Beauty & Skincare</title>
    <meta name="title" content="Beautify Africa | Premium African Beauty & Skincare" />
    <meta
      name="description"
      content="Discover luxurious African-inspired skincare, makeup, and beauty essentials. Ethically sourced ingredients celebrating the richness of African beauty traditions."
    />
    <meta
      name="keywords"
      content="African beauty, skincare, natural cosmetics, shea butter, African ingredients, luxury beauty"
    />
    <meta name="author" content="Beautify Africa" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://beautify-africa.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://beautify-africa.com/" />
    <meta property="og:title" content="Beautify Africa | Premium African Beauty & Skincare" />
    <meta
      property="og:description"
      content="Discover luxurious African-inspired skincare, makeup, and beauty essentials. Ethically sourced ingredients celebrating the richness of African beauty traditions."
    />
    <meta property="og:image" content="https://beautify-africa.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Beautify Africa - Premium African Beauty Products" />
    <meta property="og:site_name" content="Beautify Africa" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://beautify-africa.com/" />
    <meta name="twitter:title" content="Beautify Africa | Premium African Beauty & Skincare" />
    <meta
      name="twitter:description"
      content="Discover luxurious African-inspired skincare, makeup, and beauty essentials. Ethically sourced ingredients celebrating the richness of African beauty traditions."
    />
    <meta name="twitter:image" content="https://beautify-africa.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Beautify Africa - Premium African Beauty Products" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#faf9f6" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Favicon & PWA Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts - Use display=swap for non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    /></noscript>

    <!-- Performance optimizations -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
  </head>
  <body class="bg-[#faf9f6]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
