name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Back-End Tests & Automations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back-End
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Back-End/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest test suite
        run: npm test

      - name: Verify Database Migration Integrity
        run: npm run test:migration

      - name: Run Concurrency & SLA Benchmark Self-Test
        run: npm run test:load:self-test

  frontend-quality:
    name: Front-End Lint, Unit Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-End
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Front-End/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Run production build
        run: npm run build

  e2e-tests:
    name: Playwright Cross-Device E2E Matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-End
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Front-End/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        run: npm run test:e2e

      - name: Upload Playwright Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Front-End/playwright-report/
          retention-days: 7

  security-audit:
    name: Security Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Back-End Dependencies
        working-directory: Back-End
        run: npm audit --audit-level=critical

      - name: Audit Front-End Dependencies
        working-directory: Front-End
        run: npm audit --audit-level=critical
