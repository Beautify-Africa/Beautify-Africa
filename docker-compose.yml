services:
  # ============================
  # 1. Express API Backend
  # ============================
  backend:
    build:
      context: ./Back-End
    container_name: beautify_backend
    ports:
      - "5000:5000"
    # Because Docker ignores your .env file for security, we explicitly map the file here
    env_file:
      - ./Back-End/.env
    # Mongo credentials are loaded from ./Back-End/.env via env_file.
    environment:
      # When deployed natively via Render, REDIS_URL from Env Vars takes over.
      # When running inside docker-compose, this targets the inner Redis container.
      REDIS_URL: redis://redis:6379
    # Tells Docker to restart the backend automatically if it ever crashes
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # ============================
  # 2. React Vite Frontend
  # ============================
  frontend:
    build:
      context: ./Front-End
      # During compilation, Vite bakes the API URL in. We point it to the exposed backend.
      args:
        VITE_API_URL: http://localhost:5000
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_replace_me}
    container_name: beautify_frontend
    # Map it to port 4173 which closely matches your Vite Preview port
    ports:
      - "4173:80"
    # Force the frontend to wait until the backend exists before booting
    depends_on:
      - backend
    restart: unless-stopped

  # ============================
  # 3. Redis In-Memory Cache Worker
  # ============================
  redis:
    image: redis:7-alpine
    container_name: beautify_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
