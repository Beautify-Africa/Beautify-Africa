services:
  # ============================
  # 1. Express API Backend
  # ============================
  backend:
    build:
      context: ./Back-End
    container_name: beautify_backend
    ports:
      - '5000:5000'
    env_file:
      - ./Back-End/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/beautify_africa}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================
  # 2. React Vite Frontend (Nginx)
  # ============================
  frontend:
    build:
      context: ./Front-End
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    container_name: beautify_frontend
    ports:
      - '4173:80'
    depends_on:
      - backend
    restart: unless-stopped

  # ============================
  # 3. Redis In-Memory Cache Worker
  # ============================
  redis:
    image: redis:7-alpine
    container_name: beautify_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ============================
  # 4. PostgreSQL Database
  # ============================
  postgres:
    image: postgres:16-alpine
    container_name: beautify_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-beautify_africa}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d beautify_africa']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
